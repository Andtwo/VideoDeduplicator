<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VideoDeduplicator</title>
<style>
:root{--bg:#0b0e14;--panel:#11151d;--border:#242d3d;--accent:#5eead4;--text:#e6e9ef;--muted:#8a92a6;--error:#f97066}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:28px;width:100%;max-width:520px}
h1{font-size:20px;font-weight:600;margin-bottom:6px}
.sub{color:var(--muted);font-size:13px;margin-bottom:20px}
.field{margin-bottom:16px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
input[type=file]{width:100%;font-size:13px;color:var(--text)}
input[type=text]{width:100%;background:#151a24;border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:14px;outline:none}
input[type=text]:focus{border-color:var(--accent)}
.btn{width:100%;background:var(--accent);color:#0b0e14;border:none;border-radius:10px;padding:12px;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.log{background:#0d1117;border:1px solid var(--border);border-radius:8px;padding:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--muted);max-height:200px;overflow:auto;white-space:pre-wrap;margin-top:16px;display:none}
.status{margin-top:12px;font-size:13px}
.status.done{color:var(--accent)}.status.error{color:var(--error)}
.dl{display:inline-block;margin-top:12px;color:var(--accent);text-decoration:none;font-size:14px}
.dl:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="card">
<h1>VideoDeduplicator</h1>
<div class="sub">随机处理策略 · 至少 3 个画面步骤 · 自动压制字幕条</div>
<form id="f">
<div class="field"><label>内容视频 A（必填）</label><input type="file" name="video_a" accept="video/*" required></div>
<div class="field" hidden><label>素材视频 B（可选）</label><input type="file" name="video_b" accept="video/*"></div>
<div class="field" hidden><label>音频文件（可选，用于 BGM 替换）</label><input type="file" name="audio_file" accept="audio/*"></div>
<div class="field"><label>影视名称（可选）</label><input type="text" name="title" placeholder="例如：今天跟闺蜜吃烤肉自助餐喽"></div>
<button class="btn" type="submit">开始处理</button>
</form>
<div class="status" id="st"></div>
<div class="log" id="log"></div>
<a class="dl" id="dl" href="#" style="display:none">下载处理结果</a>
</div>
<script>
const f=document.getElementById('f'),st=document.getElementById('st'),log=document.getElementById('log'),dl=document.getElementById('dl'),btn=f.querySelector('button');
let timer=null;
const fail=message=>{st.textContent=message;st.className='status error';btn.disabled=false;if(timer)clearInterval(timer)};
f.onsubmit=async e=>{
e.preventDefault();if(timer)clearInterval(timer);btn.disabled=true;st.textContent='上传中...';st.className='status';dl.style.display='none';log.style.display='none';
try{
const r=await fetch('/api/process',{method:'POST',body:new FormData(f)});const d=await r.json();
if(!r.ok)throw new Error(d.detail||'提交失败');
st.textContent='排队中...';timer=setInterval(async()=>{
try{
const response=await fetch('/api/status/'+d.task_id);const s=await response.json();
if(!response.ok)throw new Error(s.detail||'状态查询失败');
st.textContent=s.status==='processing'?'处理中...':s.status==='done'?'处理完成':s.status==='error'?'处理失败':'排队中...';
st.className='status '+(s.status==='done'?'done':s.status==='error'?'error':'');
if(s.log){log.style.display='block';log.textContent=s.log;log.scrollTop=log.scrollHeight}
if(s.status==='done'){clearInterval(timer);btn.disabled=false;dl.style.display='inline-block';dl.href='/api/download/'+d.task_id}
if(s.status==='error'){clearInterval(timer);btn.disabled=false}
}catch(error){fail(error.message)}
},1500)
}catch(error){fail(error.message)}
};
</script>
</body>
</html>
