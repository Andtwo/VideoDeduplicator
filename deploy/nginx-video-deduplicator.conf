# 放入现有 server 块；本地 18080 Nginx 代理 dev02 的 9000 服务。
location = /video-deduplicator {
    return 308 /video-deduplicator/$is_args$args;
}

location ^~ /video-deduplicator/ {
    proxy_pass http://192.168.121.100:9000/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /video-deduplicator;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    client_max_body_size 2048m;
}
